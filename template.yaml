AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  DbResourceId:
    Type: String
    Default: cluster-TKGPYSS3AG4ZVN65SKJBTWPZD4
  DbUser:
    Type: String
    Default: lambda_user

Globals:
  Function:
    Runtime: python3.13
    Timeout: 150
    MemorySize: 256

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: healthfolded/
      Handler: health.lambda_handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: GET
  
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: 
              - rds-db:connect
              - rds-db:write
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: get_user/
      Handler: get_user.get_user
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /user
            Method: GET
  
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: create_user/
      Handler: create_user.create_user
      Events:
        CreateUser:
          Type: Api
          Properties:
            Path: /user
            Method: POST


