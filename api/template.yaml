  PredictFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: predict/
      Handler: predict.predict
      Events:
        Predict:
          Type: Api
          Properties:
            Path: /predict
            Method: POST

  CanPredictFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: can_predict/
      Handler: can_predict.can_predict
      Events:
        CanPredict:
          Type: Api
          Properties:
            Path: /can_predict
            Method: GET

  GetNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: get_notes/
      Handler: get_notes.get_notes
      Events:
        GetNotes:
          Type: Api
