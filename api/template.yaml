AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  DbResourceId:
    Type: String
    Default: cluster-TKGPYSS3AG4ZVN65SKJBTWPZD4
  DbUser:
    Type: String
    Default: lambda_user

Globals:
  Function:
    Runtime: python3.13
    Timeout: 150
    MemorySize: 256

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: healthfolded/
      Handler: health.lambda_handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: GET
  
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: 
              - rds-db:connect
              - rds-db:write
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: get_user/
      Handler: get_user.get_user
      Events:
        GetUser:
          Type: Api
          Properties:
            Path: /user
            Method: GET
  
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: create_user/
      Handler: create_user.create_user
      Events:
        CreateUser:
          Type: Api
          Properties:
            Path: /user
            Method: POST
  
  CreateAlterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: create_alter/
      Handler: create_alter.create_alter
      Events:
        CreateAlter:
          Type: Api
          Properties:
            Path: /alter
            Method: POST
  
  GetAltersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: get_alters/
      Handler: get_alters.get_alters
      Events:
        GetAlters:
          Type: Api
          Properties:
            Path: /alters
            Method: GET

  PutAlterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: put_alter/
      Handler: put_alter.put_alter
      Events:
        PutAlter:
          Type: Api
          Properties:
            Path: /alter
            Method: PUT

  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: create_note/
      Handler: create_note.create_note
      Events:
        CreateNote:
          Type: Api
          Properties:
            Path: /note
            Method: POST
  
  TrainModelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: train_model/
      Handler: train_model.train_model
      Events:
        TrainModel:
          Type: Api
          Properties:
            Path: /train_model
            Method: POST

  TestModelFunction:
