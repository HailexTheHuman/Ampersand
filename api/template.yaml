            Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUser}
      CodeUri: get_front_history/
      Handler: get_front_history.get_history
      Events:
        GetFrontHistory:
          Type: Api
          Properties:
            Path: /get_front_history
            Method: GET